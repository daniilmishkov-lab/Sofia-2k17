<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karte</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<h1 id="title"></h1>
<p>
 Соня помнит что шла домой через эти локации в этом порядке
</p>
<img id="map" class="map">

<div id="inventory">

<h2>🎒 Найденный шмот</h2>

<div id="items"></div>

</div>

<script src="stations.js"></script>
 
<script>

const team = localStorage.getItem("team");

document.getElementById("title").innerHTML =
"🗺️ Бригада с района " + team;

document.getElementById("map").src =
"img/map" + team + ".png";
 
let inventoryHTML = "";


for (const id in stations) {


    const item = stations[id].reward;


    if(localStorage.getItem(item.id)){


        inventoryHTML += `

        <div class="item">

            <img src="${item.image}" width="80">

            <p>
            ${item.name}
            </p>

        </div>

        `;

    }

}



if(inventoryHTML === ""){


inventoryHTML =
"Du hast noch keine Gegenstände gefunden.";


}


document.getElementById("items").innerHTML =
inventoryHTML;
</script>
</body>

</html>
