<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karte</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<h1 id="title"></h1>
<p>
 Соня помнит что шла домой через эти локации в этом порядке
</p>
<div id="route"></div>
<img id="map" class="map">
<div id="questComplete"> </div>
<div id="inventory">

<h2>🎒 Найденный шмот</h2>

<div id="items"></div>

</div>

<script src="stations.js"></script>
 
<script>

const team = localStorage.getItem("team");

document.getElementById("title").innerHTML =
"🗺️ Бригада с района " + team;

document.getElementById("map").src =
"img/map" + team + ".png";
 
let inventoryHTML = "";


for (const id in stations) {


    const item = stations[id].reward;


    if(localStorage.getItem(item.id)){


        inventoryHTML += `

        <div class="item">

            <img src="${item.image}" width="80">

            <p>
            ${item.name}
            </p>

        </div>

        `;

    }

}
const routes = {

    "1": "Bank → Telefon → Park → Brücke → Café → Denkmal → Spielplatz",

    "2": "Park → Denkmal → Bank → Spielplatz → Telefon → Café → Brücke",

    "3": "Telefon → Café → Brücke → Bank → Denkmal → Park → Spielplatz",

    "4": "Denkmal → Spielplatz → Café → Telefon → Park → Brücke → Bank"

};
document.getElementById("route").innerHTML = `

    <div class="route-box">
        <p>
            ${routes[team]}
        </p>

    </div>

`;
const requiredItems = [
    "kopfhoerer",
    "iphone",
    "glasses",
    "spinner",
    "rosathing",
    "vans",
    "tea"
];


const allItemsFound =
    requiredItems.every(
        item => localStorage.getItem(item) === "true"
    );


if (allItemsFound) {

    document.getElementById("questComplete").innerHTML = `

        <div class="quest-complete">

            <h2>🎉 Поздравляем!</h2>

            <p>
                Вы нашли все семь предметов!
            </p>

            <p>
                Ваша миссия выполнена.
            </p>

            <p>
                Теперь отправляйтесь к Соне на вписку и получите свой приз!
            </p>

        </div>

    `;

}

if(inventoryHTML === ""){


inventoryHTML =
"Пока ничего не найдено.";


}


document.getElementById("items").innerHTML =
inventoryHTML;
</script>
</body>

</html>
